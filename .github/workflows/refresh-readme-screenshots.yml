name: Refresh README screenshots

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Commit validated screenshot changes to the default branch
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 9 * * *"
      timezone: "America/Chicago"

permissions:
  contents: write

concurrency:
  group: refresh-readme-screenshots
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out screenshot source
        uses: actions/checkout@v5
        with:
          ref: ${{ (github.event_name == 'schedule' || inputs.publish) && github.event.repository.default_branch || github.ref }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Refresh README screenshots
        run: pnpm screenshots:refresh

      - name: Detect screenshot changes
        id: screenshot_changes
        shell: bash
        run: |
          if ! git diff --quiet -- . ':(exclude)assets/screenshots/*.png'; then
            echo "::error::Screenshot refresh modified files outside assets/screenshots."
            git status --short
            exit 1
          fi

          if git diff --quiet -- assets/screenshots; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Upload screenshot preview
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-preview-${{ github.run_id }}
          path: assets/screenshots/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Commit refreshed screenshots
        if: (github.event_name == 'schedule' || inputs.publish) && steps.screenshot_changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          default_branch="${{ github.event.repository.default_branch }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/screenshots/*.png
          git commit -m "Refresh README screenshots"

          git fetch origin "$default_branch"

          if ! git merge-base --is-ancestor "origin/$default_branch" HEAD; then
            git rebase "origin/$default_branch"
          fi

          git push origin "HEAD:$default_branch"

      - name: Upload Playwright debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-debug-artifacts
          path: output/playwright/
          if-no-files-found: ignore
          retention-days: 7
